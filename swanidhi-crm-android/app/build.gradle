plugins {
    id 'com.android.application'
}

// Release signing reads keystore.properties (kept out of git). Without it the
// release build falls back to the debug key so it still installs for testing.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace 'com.swanidhi.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.swanidhi.crm'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'CRM_URL', '"https://swanidhigroupofinstitutions.com/crm/"'
        buildConfigField 'String', 'CRM_HOST', '"swanidhigroupofinstitutions.com"'
        // true: run the bundled offline demo CRM (assets/demo) on dummy data.
        // Set to false once Supabase is connected on the live site to load the real CRM.
        buildConfigField 'boolean', 'DEMO_MODE', 'true'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Aligns kotlin-stdlib-jdk7/jdk8 pulled in transitively with kotlin-stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
